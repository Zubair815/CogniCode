<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CogniCode is a Socratic AI tutor for programming students that guides with questions and progressive hints instead of handing out answers." />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <title>CogniCode</title>
    <script>
      // Apply the saved theme before first paint (mirrors ThemeContext).
      (function () {
        var pref = "system";
        try {
          var stored = localStorage.getItem("cc-theme");
          if (stored === "light" || stored === "dark" || stored === "system") pref = stored;
        } catch (e) {
          /* storage unavailable: use OS preference */
        }
        var dark = pref === "dark" ||
          (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
