version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cognicode-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./cognicode.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - cognicode-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cognicode-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cognicode-net

networks:
  cognicode-net:
    driver: bridge
