version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cognicode-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in environment}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
      - POSTGRES_DB=${POSTGRES_DB:-cognicode}
    # PostgreSQL is kept strictly on the internal bridge network (never published on host ports)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-cognicode}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - cognicode-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cognicode-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cognicode}
      - JWT_SECRET=${JWT_SECRET:?Set a strong 32+ char JWT_SECRET in environment}
      - INSTRUCTOR_INVITE_CODE=${INSTRUCTOR_INVITE_CODE:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - cognicode-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: cognicode-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cognicode-net

volumes:
  postgres_data:

networks:
  cognicode-net:
    driver: bridge
