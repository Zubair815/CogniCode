version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cognicode-postgres
    environment:
      - POSTGRES_USER=cognicode
      - POSTGRES_PASSWORD=cognicode_pass
      - POSTGRES_DB=cognicode
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cognicode-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cognicode-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://cognicode:cognicode_pass@postgres:5432/cognicode
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - cognicode-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cognicode-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cognicode-net

volumes:
  postgres_data:

networks:
  cognicode-net:
    driver: bridge
