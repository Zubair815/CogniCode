name: Backend CI

on:
  push:
    branches: [main, develop, feature/*]
    paths:
      - 'backend/**'
      - 'pytest.ini'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'pytest.ini'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cognicode_test
          POSTGRES_PASSWORD: cognicode_test_password
          POSTGRES_DB: cognicode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Apply Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg2://cognicode_test:cognicode_test_password@localhost:5432/cognicode_test
          JWT_SECRET: ci_test_secret_at_least_32_characters_long_12345
        run: alembic upgrade head

      - name: Run pytest suite
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg2://cognicode_test:cognicode_test_password@localhost:5432/cognicode_test
          TEST_DATABASE_URL: postgresql+psycopg2://cognicode_test:cognicode_test_password@localhost:5432/cognicode_test
          JWT_SECRET: ci_test_secret_at_least_32_characters_long_12345
          INSTRUCTOR_INVITE_CODE: test-instructor-invite-code
          PYTHONPATH: .
        run: pytest tests/ -v
